name: Build release zip

# `v1.0.0` ধরনের ট্যাগ পুশ করলে vendor সহ প্রস্তুত zip বানায় (SSH/Composer ছাড়া cPanel ক্লায়েন্টের জন্য)।
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, gd, zip, bcmath, pdo_mysql, fileinfo, dom, curl, xml
          tools: composer:v2

      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-scripts

      - name: Package
        run: |
          zip -qr shop-release.zip . \
            -x ".git/*" ".github/*" "tests/*" "node_modules/*" ".env" ".cpanel.yml" "DEPLOY.md" "phpunit.xml" "*.log"
          ls -la shop-release.zip

      - uses: actions/upload-artifact@v4
        with:
          name: shop-release
          path: shop-release.zip

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: shop-release.zip
